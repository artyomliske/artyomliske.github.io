<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Страница не найдена — Артём Лиске</title>
<link rel="stylesheet" href="styles.css">
<style>
  .not-found { min-height:100vh; display:flex; align-items:center; padding:var(--pad); }
  .not-found__in { max-width:44rem; }
  .not-found h1 { margin:.8rem 0 1.25rem; }
  .not-found .txt { max-width:48ch; }
  .not-found .btn { margin-top:2rem; }
</style>
</head>
<body>
<main class="not-found">
  <div class="not-found__in">
    <p class="lab lab--a">404</p>
    <h1>Этой страницы<br>здесь нет.</h1>
    <p class="txt">Возможно, ссылка устарела. На главной — системы, которые снимают ручную работу и оставляют решение человеку.</p>
    <a class="btn" href="/">Вернуться к портфолио</a>
  </div>
</main>
</body>
</html>
